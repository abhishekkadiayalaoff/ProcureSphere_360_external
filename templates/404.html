{% extends 'base.html' %}

{% block title %}404 - Page Not Found — ProcureSphere 360{% endblock %}

{% block content %}
<div class="container py-5 text-center" style="max-width: 600px;">
    <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
        <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-4" style="width: 88px; height: 88px;">
            <i class="fa-solid fa-compass-drafting fs-1"></i>
        </div>
        <h1 class="fw-bold text-dark mb-2">Page Not Found (404)</h1>
        <p class="text-muted mb-4 fs-6">The procurement resource, document, or page you requested could not be located or may have been moved.</p>
        <div class="d-flex justify-content-center gap-2 flex-wrap">
            <a href="/" class="btn btn-primary rounded-pill px-4 py-2 fw-semibold shadow-sm">
                <i class="fa-solid fa-house me-2"></i>Return to Dashboard
            </a>
            <a href="/requisitions/" class="btn btn-outline-secondary rounded-pill px-4 py-2 fw-semibold">
                <i class="fa-solid fa-list me-2"></i>View Requisitions
            </a>
        </div>
    </div>
</div>
{% endblock %}
