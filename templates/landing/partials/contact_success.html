<!-- Contact Form Success Response (HTMX partial) — matches React AnimatePresence "success-card" state -->
<div
  class="rfp-form contact-success-card"
  style="
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;min-height:440px;padding:48px 32px;
    animation:contactSuccessIn 0.45s cubic-bezier(0.16,1,0.3,1) forwards;
  "
>
  <!-- Green animated circle checkmark -->
  <div
    class="contact-success-icon"
    style="
      width:76px;height:76px;border-radius:50%;
      background:linear-gradient(135deg,#22c55e 0%,#10b981 100%);
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 12px 32px rgba(16,185,129,0.35),0 0 0 10px rgba(16,185,129,0.12);
      margin-bottom:20px;
      animation:contactIconPop 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.1s both;
    "
  >
    <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </div>

  <!-- Status badge -->
  <span style="
    display:inline-flex;align-items:center;gap:8px;
    padding:6px 14px;border-radius:999px;
    background:rgba(16,185,129,0.1);color:#059669;
    font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;
    margin-bottom:14px;
  ">
    <i style="width:6px;height:6px;border-radius:50%;background:#10b981;display:inline-block;"></i>
    Request Received
  </span>

  <!-- Heading -->
  <h3 style="
    font-family:'Playfair Display','Georgia',serif;
    font-size:clamp(26px,3.2vw,36px);font-weight:600;
    color:#0f172a;margin:0 0 12px 0;
  ">Successfully Submitted!</h3>

  <!-- Description -->
  <p style="font-size:16px;color:#64748b;max-width:460px;line-height:1.65;margin:0 0 8px 0;">
    Thank you, <strong>{{ name }}</strong>! Your RFP brief and workflow details have been successfully received.
  </p>
  <p style="font-size:14px;color:#94a3b8;margin:0 0 32px 0;font-family:'DM Mono',monospace;">{{ email }}</p>

  <!-- Back to form button -->
  <button
    type="button"
    onclick="resetContactForm()"
    class="button button-primary"
    style="
      padding:14px 28px;font-size:15px;font-weight:600;cursor:pointer;
      display:inline-flex;align-items:center;gap:10px;
      box-shadow:0 8px 24px rgba(36,86,214,0.25);border:none;border-radius:10px;
    "
  >
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="1 4 1 10 7 10"/>
      <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
    </svg>
    Resubmit / Back to Form
  </button>
</div>

<style>
@keyframes contactSuccessIn {
  from { opacity: 0; transform: scale(0.94) translateY(16px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes contactIconPop {
  from { transform: scale(0) rotate(-20deg); }
  to   { transform: scale(1) rotate(0deg); }
}
</style>

<script>
function resetContactForm() {
  var csrfToken = (document.cookie.match(/csrftoken=([^;]+)/) || [])[1] || '';
  document.getElementById('contact-form-wrapper').innerHTML = `
    <form class="rfp-form" id="contact-form"
      hx-post="/htmx/contact/"
      hx-target="#contact-form-wrapper"
      hx-swap="innerHTML"
      hx-on::after-request="onContactFormResponse(event)"
      style="animation:contactSuccessIn 0.3s ease forwards;"
    >
      <input type="hidden" name="csrfmiddlewaretoken" value="${csrfToken}">
      <div class="form-grid">
        <label><span>Name</span><input required name="name" placeholder="Your name" /></label>
        <label><span>Email</span><input required type="email" name="email" placeholder="yourname@gmail.com" /></label>
        <label><span>Company</span><input required name="company" placeholder="Company name" /></label>
        <label><span>Procurement scope</span>
          <select required name="scope"><option value="" disabled selected>Select a scope</option><option>Source-to-pay</option><option>Supplier management</option><option>Invoice and financial control</option><option>Contract lifecycle</option><option>Vendor participation</option></select>
        </label>
      </div>
      <label><span>Message</span><textarea required name="message" rows="5" placeholder="Tell us what you want to connect..."></textarea></label>
      <div class="form-actions">
        <button class="button button-primary" type="submit">Request a Demo
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13"/><path d="m13 6 6 6-6 6"/></svg>
        </button>
      </div>
    </form>`;
  if (typeof htmx !== 'undefined') htmx.process(document.getElementById('contact-form'));
  // Reset vendor image if visible
  var img = document.getElementById('contact-vendor-img');
  if (img) {
    img.src = img.src.replace('active.webp', 'idle.webp');
    img.style.transform = '';
    img.style.filter = '';
  }
}
</script>
