<!-- Contact Form Error Response (HTMX partial) -->
<div class="rfp-form" style="border:2px solid #fecaca;background:#fef2f2;border-radius:16px;padding:20px 24px;margin-bottom:20px;display:flex;align-items:center;gap:12px;">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
  <span style="color:#dc2626;font-weight:600;font-size:15px;">{{ error }}</span>
</div>
<form class="rfp-form" id="contact-form" hx-post="/htmx/contact/" hx-target="#contact-form-wrapper" hx-swap="innerHTML" hx-on::after-request="onContactFormResponse(event)">
  <input type="hidden" name="csrfmiddlewaretoken" value="">
  <div class="form-grid">
    <label><span>Name</span><input required name="name" placeholder="Your name" /></label>
    <label><span>Email</span><input required type="email" name="email" placeholder="yourname@gmail.com" /></label>
    <label><span>Company</span><input required name="company" placeholder="Company name" /></label>
    <label><span>Procurement scope</span>
      <select required name="scope">
        <option value="" disabled selected>Select a scope</option>
        <option>Source-to-pay</option>
        <option>Supplier management</option>
        <option>Invoice and financial control</option>
        <option>Contract lifecycle</option>
        <option>Vendor participation</option>
      </select>
    </label>
  </div>
  <label><span>Message</span><textarea required name="message" rows="5" placeholder="Tell us what you want to connect..."></textarea></label>
  <div class="form-actions">
    <button class="button button-primary" type="submit">
      Request a Demo
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13"/><path d="m13 6 6 6-6 6"/></svg>
    </button>
  </div>
</form>
<script>
// Re-apply CSRF token after HTMX swap
(function(){
  const form = document.getElementById('contact-form');
  if(form){
    const csrfInput = form.querySelector('[name=csrfmiddlewaretoken]');
    const cookie = document.cookie.match(/csrftoken=([^;]+)/);
    if(csrfInput && cookie) csrfInput.value = cookie[1];
    htmx.process(form);
  }
})();
</script>
