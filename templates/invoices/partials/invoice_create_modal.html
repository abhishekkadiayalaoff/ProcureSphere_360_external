<div class="modal-header border-bottom border-secondary">
    <h5 class="modal-title text-dark fw-bold">
        <i class="fa-solid fa-receipt text-danger me-2"></i> Submit Supplier Invoice
    </h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<form method="POST" action="/invoices/create/">
    {% csrf_token %}
    <div class="modal-body p-4">
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label text-dark fw-semibold small">Target Purchase Order *</label>
                <select name="po_id" class="form-select" required>
                    <option value="">Select Issued / Acknowledged PO...</option>
                    {% for po in purchase_orders %}
                        <option value="{{ po.id }}">{{ po.po_number }} — {{ po.vendor.legal_name }} (${{ po.total_amount|floatformat:2 }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label text-dark fw-semibold small">Supplier Invoice Number *</label>
                <input type="text" name="invoice_number" class="form-control" placeholder="e.g. INV-CISCO-99182" required>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label text-dark fw-semibold small">Invoice Date *</label>
                <input type="date" name="invoice_date" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label text-dark fw-semibold small">Payment Due Date *</label>
                <input type="date" name="due_date" class="form-control" required>
            </div>
        </div>

        <h6 class="fw-bold text-dark mt-4 mb-2 small text-uppercase" style="letter-spacing: 0.05em;">
            <i class="fa-solid fa-list text-primary me-1"></i> Billed Line Items
        </h6>
        <div class="p-3 bg-light rounded-3 border mb-3">
            <div class="row g-2 mb-2">
                <div class="col-md-6">
                    <label class="form-label text-muted small mb-1">Item Description</label>
                    <input type="text" name="item_name" class="form-control form-control-sm" placeholder="e.g. Cisco Catalyst 9600 Switch" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted small mb-1">Billed Qty</label>
                    <input type="number" name="quantity" class="form-control form-control-sm" value="1" min="1" step="0.01" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted small mb-1">Billed Unit Price ($)</label>
                    <input type="number" name="unit_price" class="form-control form-control-sm" placeholder="25000.00" min="0" step="0.01" required>
                </div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label text-dark fw-semibold small">Invoice Notes & Remarks</label>
            <textarea name="notes" class="form-control" rows="2" placeholder="Notes for Accounts Payable..."></textarea>
        </div>
    </div>

    <div class="modal-footer border-top border-secondary">
        <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-danger rounded-pill px-4 fw-bold shadow-sm">
            <i class="fa-solid fa-cloud-arrow-up me-1"></i> Submit & Run 3-Way Match
        </button>
    </div>
</form>
