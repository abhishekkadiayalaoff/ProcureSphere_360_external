<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ProcureSphere 360 ERP{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Custom Styles -->
    <link href="/static/css/style.css" rel="stylesheet">
    <!-- HTMX library -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="bg-light">
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/">
                <i class="fa-solid fa-layer-group text-primary me-2"></i>ProcureSphere 360
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" href="/"><i class="fa-solid fa-chart-line me-1"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/api/docs/"><i class="fa-solid fa-book me-1"></i> API Docs</a></li>
                    <li class="nav-item"><a class="nav-link" href="/health/"><i class="fa-solid fa-heart-pulse me-1"></i> System Health</a></li>
                </ul>
                <div class="d-flex align-items-center text-white">
                    {% if user.is_authenticated %}
                        <span class="me-3"><i class="fa-solid fa-user-circle me-1"></i> {{ user.email }} ({{ user.role_code|default:"User" }})</span>
                        <a href="/admin/logout/" class="btn btn-outline-light btn-sm">Logout</a>
                    {% else %}
                        <a href="/admin/login/" class="btn btn-primary btn-sm me-2">Sign In</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container-fluid my-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
