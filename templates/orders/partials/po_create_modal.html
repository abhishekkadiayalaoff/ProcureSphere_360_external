<div class="modal-header border-bottom border-secondary">
    <h5 class="modal-title text-dark fw-bold">
        <i class="fa-solid fa-cart-shopping text-cyan me-2"></i> Execute Purchase Order (PO)
    </h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<form method="POST" action="/purchase-orders/create/">
    {% csrf_token %}
    <div class="modal-body p-4">
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label text-dark fw-semibold small">Awarded Vendor *</label>
                <select name="vendor_id" class="form-select" required>
                    <option value="">Select Active Vendor...</option>
                    {% for vendor in vendors %}
                        <option value="{{ vendor.id }}">{{ vendor.legal_name }} ({{ vendor.vendor_number }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label text-dark fw-semibold small">Cost Center *</label>
                <select name="cost_center_id" class="form-select" required>
                    <option value="">Select Cost Center...</option>
                    {% for cc in cost_centers %}
                        <option value="{{ cc.id }}">{{ cc.code }} — {{ cc.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label text-dark fw-semibold small">Approved Source Requisition (Optional)</label>
            <select name="requisition_id" class="form-select">
                <option value="">Select Approved PR...</option>
                {% for pr in requisitions %}
                    <option value="{{ pr.id }}">{{ pr.pr_number }} — {{ pr.title }} (${{ pr.total_amount|floatformat:2 }})</option>
                {% endfor %}
            </select>
        </div>

        <h6 class="fw-bold text-dark mt-4 mb-2 small text-uppercase" style="letter-spacing: 0.05em;">
            <i class="fa-solid fa-list-check text-primary me-1"></i> Order Line Items
        </h6>
        <div class="p-3 bg-light rounded-3 border mb-3">
            <div class="row g-2 mb-2">
                <div class="col-md-6">
                    <label class="form-label text-muted small mb-1">Item Description</label>
                    <input type="text" name="item_name" class="form-control form-control-sm" placeholder="e.g. HPE ProLiant DL380 Gen11 Server" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted small mb-1">Quantity</label>
                    <input type="number" name="quantity" class="form-control form-control-sm" value="1" min="1" step="0.01" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted small mb-1">Unit Price ($)</label>
                    <input type="number" name="unit_price" class="form-control form-control-sm" placeholder="12500.00" min="0" step="0.01" required>
                </div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label text-dark fw-semibold small">Terms & Conditions</label>
            <textarea name="terms_and_conditions" class="form-control" rows="2">Standard HPE Enterprise Procurement Terms & Conditions (FOB Destination, Net 30)</textarea>
        </div>
    </div>

    <div class="modal-footer border-top border-secondary">
        <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-cyan rounded-pill px-4 fw-bold shadow-sm">
            <i class="fa-solid fa-plus me-1"></i> Issue Purchase Order
        </button>
    </div>
</form>
