name: ProcureSphere 360 CI Workflow

on:
  push:
    branches: [ main, staging, "feature/**", "bugfix/**" ]
  pull_request:
    branches: [ main, staging ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: procuresphere_test_db
          POSTGRES_USER: procure_user
          POSTGRES_PASSWORD: procure_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff & Black
        run: |
          ruff check .
          black --check .

      - name: Run Migrations Check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          DB_HOST: localhost
          DB_NAME: procuresphere_test_db
          DB_USER: procure_user
          DB_PASSWORD: procure_password
          REDIS_URL: redis://localhost:6379/0
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate

      - name: Run Pytest Suite with Coverage
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          DB_HOST: localhost
          DB_NAME: procuresphere_test_db
          DB_USER: procure_user
          DB_PASSWORD: procure_password
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest --cov=src --cov-report=term-missing
