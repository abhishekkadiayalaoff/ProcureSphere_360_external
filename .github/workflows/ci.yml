name: ProcureSphere 360 CI Workflow

on:
  push:
    branches: [ main, dev, staging, "feature/**", "features/**", "bugfix/**" ]
  pull_request:
    branches: [ main, dev, staging ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: procuresphere_test_db
          POSTGRES_USER: procure_user
          POSTGRES_PASSWORD: procure_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U procure_user -d procuresphere_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff & Black (Changed Python Files)
        run: |
          git fetch origin dev || true
          if [ -n "$GITHUB_BASE_REF" ]; then
            BASE_REF="origin/$GITHUB_BASE_REF"
          else
            BASE_REF="origin/dev"
          fi
          CHANGED_FILES=$(git diff --name-only --diff-filter=d $BASE_REF...HEAD -- "*.py" 2>/dev/null || true)
          if [ -z "$CHANGED_FILES" ]; then
            CHANGED_FILES=$(git diff --name-only --diff-filter=d HEAD~1 HEAD -- "*.py" 2>/dev/null || true)
          fi
          if [ -n "$CHANGED_FILES" ]; then
            echo "Linting changed Python files:"
            echo "$CHANGED_FILES"

            ruff check $CHANGED_FILES
            black --check $CHANGED_FILES
          else
            echo "No changed Python files detected. Skipping lint."
          fi
      - name: Run Migrations Check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: procuresphere_test_db
          DB_USER: procure_user
          DB_PASSWORD: procure_password
          REDIS_URL: redis://localhost:6379/0
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate

      - name: Run Pytest Suite with Coverage
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: procuresphere_test_db
          DB_USER: procure_user
          DB_PASSWORD: procure_password
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest --cov=src --cov-report=term-missing
